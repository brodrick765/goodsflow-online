<div id="login" class="login"><div class="box"><h2>GoodsFlow</h2><p class="muted">Sign in to your business goods portal.</p><form id="loginForm" class="form"><label>Email<input id="email" type="email" value="brodrick765@gmail.com" required></label><label>Password<input id="password" type="password" value="" required></label><button class="btn">Sign in</button><div id="loginError" class="error"></div></form></div></div>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#172033}.login{min-height:100vh;display:grid;place-items:center}.box{width:min(420px,90vw);padding:32px;background:white;border-radius:16px;box-shadow:0 8px 30px #0001}.form{display:grid;gap:16px}label{display:grid;gap:6px;font-weight:600}input{padding:12px;border:1px solid #ccd3df;border-radius:8px;font:inherit}.btn{padding:12px;border:0;border-radius:8px;background:#172033;color:white;font-weight:700;cursor:pointer}.muted{color:#667085}.error{color:#b42318}
</style>
<script>
const $=id=>document.getElementById(id);const api=async(u,o={})=>{o.headers={'Content-Type':'application/json',...(o.headers||{})};const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d};
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const me=await api('/api/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});document.querySelector('.box').innerHTML='<h2>Welcome, '+me.name+'</h2><p>GoodsFlow is online and ready.</p><button class="btn" onclick="location.reload()">Continue</button>'}catch(e){$('loginError').textContent=e.message}};
</script>
